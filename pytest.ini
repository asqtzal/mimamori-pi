[pytest]
# Pytest configuration for mimamori-pi

# PYTHONPATHにsrc/ディレクトリを追加
# これにより、tests/内のテストコードから mimamori_pi モジュールをインポート可能にする
pythonpath = src

# テスト検索パターン
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# テスト実行時のオプション
addopts =
    # 詳細な出力
    -v
    # 失敗時に詳細なトレースバックを表示
    --tb=short
    # キャプチャされた出力を表示
    --capture=no
    # カバレッジレポートを生成（80%以上を目標）
    --cov=mimamori_pi
    --cov-report=term-missing
    --cov-report=html
    # カバレッジの最低閾値（80%）
    --cov-fail-under=80
    # 警告を表示
    -W default

# テスト検索ディレクトリ
testpaths = tests

# マーカー定義
markers =
    unit: ユニットテスト（モックを使用した単一モジュールのテスト）
    integration: 統合テスト（複数モジュールの統合テスト）
    hardware: ハードウェアテスト（実際のカメラが必要なテスト）
    slow: 実行に時間がかかるテスト

# カバレッジ設定
[coverage:run]
source = src/mimamori_pi
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
# カバレッジレポートから除外するパターン
exclude_lines =
    # 標準的な除外パターン
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

